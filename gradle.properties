# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.1.0
maven_group=xyz.blanchot

# Test / benchmark dependencies
junit_version=6.1.2
jmh_version=1.37

# Config (Fzzy Config + its mandatory Kotlin runtime; ModMenu is dev-only)
fzzy_config_version=0.7.6+26.2

# MixinExtras: compile-only, matches the version bundled by fabric-loader 0.19.3
mixinextras_version=0.5.4

# Fabric API: compile-only. Not a runtime dependency (see build.gradle) --
# only needed because ChunkAccess's interface hierarchy references
# FabricBlockGetter/AttachmentTarget, which javac must resolve to compile
# against ChunkAccess at all, even without calling anything Fabric-API-specific.
fabric_api_version=0.156.0+26.2
