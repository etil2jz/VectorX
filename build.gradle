plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }
    maven {
        // ModMenu, dev-only: verifies the config GUI actually registers.
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "vectorx" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            vmArgs "--add-modules=jdk.incubator.vector"
        }
        server {
            vmArgs "--add-modules=jdk.incubator.vector"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Loom's dev-workspace Minecraft jar has fabric-api's own mixins already
    // woven into vanilla classes (a dev-convenience Loom applies whenever
    // fabric-api is anywhere in the dependency graph, not a production
    // behavior). That means even vanilla server bootstrap code references
    // fabric-api types in its bytecode in *this* jar, so the plain JUnit
    // `test` task's runtimeClasspath -- unlike Loom's own runServer/runClient
    // tasks, which build their own classpath and don't need this -- needs
    // fabric-api on it too, or Bootstrap.bootStrap() throws
    // NoClassDefFoundError trying to load a class like
    // net.fabricmc.fabric.api.registry.fluid.EntityFluidExtension. Real
    // production servers run the real, unpatched vanilla jar and never hit
    // this; it's purely a dev/test-environment artifact.
    testRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "me.fzzyhmstrs:fzzy_config:${fzzy_config_version}"

    compileOnly "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// --- JMH benchmark source set (manually wired) ---
sourceSets {
    jmh {
        java.srcDir "src/jmh/java"
        resources.srcDir "src/jmh/resources"
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    jmhImplementation.extendsFrom implementation
    jmhAnnotationProcessor
}

dependencies {
    jmhImplementation "org.openjdk.jmh:jmh-core:${jmh_version}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmh_version}"
}

tasks.register("jmhRun", JavaExec) {
    group = "verification"
    description = "Runs the JMH benchmarks (jdk.incubator.vector required at runtime)."
    dependsOn tasks.named("jmhClasses")
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass.set("org.openjdk.jmh.Main")
    jvmArgs = ["--add-modules=jdk.incubator.vector"]
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs.addAll(["--add-modules", "jdk.incubator.vector"])
}

tasks.named("test", Test) {
    useJUnitPlatform()
    jvmArgs "--add-modules=jdk.incubator.vector"
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
